name: CI/CD

# Flux de travail : le code est poussé sur « develop » (vérifié à chaque envoi), puis une pull
# request develop -> main (vérifiée à nouveau) le fait entrer dans « main ».
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Une nouvelle poussée sur la même branche annule l'exécution précédente encore en cours.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Droits minimaux par défaut ; seul le job de publication en demande davantage.
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------------------
  django:
    name: Django (${{ matrix.db }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, postgres]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: helpdesk
          POSTGRES_USER: helpdesk
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U helpdesk"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: ticket-service
    env:
      # Vide => SQLite ; défini => PostgreSQL (voir config/settings.py).
      POSTGRES_HOST: ${{ matrix.db == 'postgres' && 'localhost' || '' }}
      POSTGRES_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: ticket-service/requirements.txt
      - run: pip install -r requirements.txt
      - name: Vérifications Django
        run: python manage.py check
      - name: Aucune migration oubliée
        # Échoue si un modèle a changé sans migration : la base de production serait en retard.
        run: python manage.py makemigrations --check --dry-run
      - name: Tests
        run: python -m pytest

  # ---------------------------------------------------------------------------------------
  spring:
    name: Spring Boot
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sla-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Compilation et tests (base H2 en mémoire, sans Oracle)
        run: ./mvnw -B verify
      - name: Rapports de tests (en cas d'échec)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: sla-service/target/surefire-reports

  # ---------------------------------------------------------------------------------------
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: ESLint
        run: npx eslint .
      - name: TypeScript
        # Next.js génère lui-même certains types (LayoutProps...) : sur un dépôt vierge, il faut
        # les produire avant de lancer tsc.
        run: npx next typegen && npx tsc --noEmit
      - name: Compilation de production
        run: npm run build

  # ---------------------------------------------------------------------------------------
  e2e:
    name: Bout en bout (pile Docker complète)
    needs: [django, spring, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Secrets aléatoires pour cette exécution
        run: ./scripts/make-env.sh
      - name: Démarrage de la pile (PostgreSQL, Oracle, Django, Spring Boot, frontend)
        # --wait : attend que tous les healthchecks soient verts.
        run: docker compose up -d --build --wait --wait-timeout 600
      - name: Parcours complet
        run: python3 scripts/smoke_test.py
      - name: Journaux des conteneurs (en cas d'échec)
        if: failure()
        run: docker compose logs --no-color --tail 200
      - name: Nettoyage
        if: always()
        run: docker compose down -v

  # ---------------------------------------------------------------------------------------
  # Déploiement continu : sur la branche principale uniquement, après réussite de tout le reste,
  # les trois images sont publiées dans le registre GitHub (ghcr.io).
  publish:
    name: Publication de l'image ${{ matrix.service }}
    needs: [e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [ticket-service, sla-service, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Nom d'image en minuscules (exigé par le registre)
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.service }}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          # Adresse publique de l'API « gravée » dans le frontend à la compilation.
          # À définir dans Settings > Variables du dépôt (PUBLIC_API_URL) avant un vrai déploiement.
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.PUBLIC_API_URL || 'http://localhost:8000/api' }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
