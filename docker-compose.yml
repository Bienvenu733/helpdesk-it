# HelpDesk IT : toute l'application en une commande.
#   cp .env.example .env     (puis remplacer les valeurs « changez-moi »)
#   docker compose up --build
name: helpdesk-it

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-helpdesk}
      POSTGRES_USER: ${POSTGRES_USER:-helpdesk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Définissez POSTGRES_PASSWORD dans .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"   # accessible depuis votre machine uniquement
    healthcheck:
      # -h 127.0.0.1 : on teste la connexion RÉSEAU. Sans cela, pg_isready interroge le socket local,
      # que le serveur temporaire de la première initialisation ouvre déjà : le conteneur se déclare
      # « prêt » alors que les autres services ne peuvent pas encore s'y connecter.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  oracle:
    image: gvenzl/oracle-free:slim
    restart: unless-stopped
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:?Définissez ORACLE_PASSWORD dans .env}
      APP_USER: sla
      APP_USER_PASSWORD: ${SLA_DB_PASSWORD:?Définissez SLA_DB_PASSWORD dans .env}
    volumes:
      - oracle-data:/opt/oracle/oradata
    ports:
      - "127.0.0.1:${ORACLE_HOST_PORT:-1521}:1521"
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  ticket-service:
    build: ./ticket-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DJANGO_DEBUG: "false"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Définissez DJANGO_SECRET_KEY dans .env}
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,ticket-service
      CORS_ALLOWED_ORIGINS: ${PUBLIC_FRONTEND_URL:-http://localhost:3000}
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-helpdesk}
      POSTGRES_USER: ${POSTGRES_USER:-helpdesk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Le nom du service sert d'adresse sur le réseau interne de Docker.
      SLA_SERVICE_URL: http://sla-service:8081
      SLA_API_KEY: ${SLA_API_KEY:?Définissez SLA_API_KEY dans .env}
      SEED_DEMO: ${SEED_DEMO:-false}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
    ports:
      - "${DJANGO_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/admin/login/')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  sla-service:
    build: ./sla-service
    restart: unless-stopped
    depends_on:
      oracle:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:oracle:thin:@//oracle:1521/FREEPDB1
      DB_PASSWORD: ${SLA_DB_PASSWORD}
      SLA_API_KEY: ${SLA_API_KEY}
    ports:
      - "${SLA_PORT:-8081}:8081"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      args:
        # Lue par le NAVIGATEUR : c'est l'adresse publique de l'API, pas le nom Docker interne.
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8000/api}
    restart: unless-stopped
    depends_on:
      ticket-service:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:3000"

volumes:
  postgres-data:
  oracle-data:
