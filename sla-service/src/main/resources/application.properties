spring.application.name=sla-service
server.port=8081

# Connexion à Oracle (conteneur Docker). FREEPDB1 est la base « pluggable » par défaut.
spring.datasource.url=jdbc:oracle:thin:@//localhost:1521/FREEPDB1
spring.datasource.username=sla
# Aucune valeur par défaut : sans DB_PASSWORD, le service refuse de démarrer.
# En développement local, activez le profil « dev » (voir application-dev.properties).
spring.datasource.password=${DB_PASSWORD}

# Hibernate crée/met à jour les tables à partir des entités (pratique en développement).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Clé partagée avec le service Django pour sécuriser les appels entre services.
sla.api-key=${SLA_API_KEY}

management.endpoints.web.exposure.include=health

# Initialise le serveur web dès le démarrage plutôt qu'à la première requête.
spring.mvc.servlet.load-on-startup=1
