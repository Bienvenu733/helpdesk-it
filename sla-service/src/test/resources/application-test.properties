# Profil « test » : base H2 en mémoire (mode Oracle) au lieu du vrai Oracle.
# Les tests tournent donc partout (poste, CI) sans Docker ni base externe.
spring.datasource.url=jdbc:h2:mem:slatest;MODE=Oracle;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
sla.api-key=test-key
